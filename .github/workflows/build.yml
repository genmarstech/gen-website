name: build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Charter 03 §III: "CI runs on every push. A red pipeline blocks deploy —
# there is no manual override."

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci --no-audit --no-fund

      # Guards against brand constants used as themeable values — the bug that
      # produced a light panel with light text in dark mode.
      - run: npm run check:theme

      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build

  image:
    name: image
    needs: verify
    runs-on: ubuntu-latest
    # Only publish from main. A pull request builds the image to prove it builds,
    # but nothing from an unreviewed branch reaches the registry.
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha,format=long
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          # Push only on main. PRs build to verify the Dockerfile still works.
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test the image
        run: |
          docker build -t gen-website:test .
          docker run -d --name smoke -p 127.0.0.1:3000:3000 gen-website:test
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3000/healthz > /dev/null; then break; fi
            sleep 1
          done
          echo "--- healthz ---"
          curl -fsS http://127.0.0.1:3000/healthz && echo
          echo "--- homepage status ---"
          curl -fsS -o /dev/null -w '%{http_code}\n' http://127.0.0.1:3000/
          echo "--- trailing-slash route ---"
          curl -fsS -o /dev/null -w '%{http_code}\n' http://127.0.0.1:3000/approach/
          echo "--- bare route (no slash) ---"
          curl -fsS -o /dev/null -w '%{http_code}\n' -L http://127.0.0.1:3000/approach
          echo "--- 404 must be 404, not 200 ---"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3000/nope)" = "404"
          echo "--- security headers ---"
          curl -fsSI http://127.0.0.1:3000/ | grep -iE 'content-security-policy|x-content-type-options|x-frame-options' 
          docker rm -f smoke
