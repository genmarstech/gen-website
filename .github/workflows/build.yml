name: build

# Charter 03 §III: "CI runs on every push. A red pipeline blocks deploy —
# there is no manual override."
#
# This workflow is the gate. It never touches the server; a green run on `main`
# is what allows deploy.yml to start, and nothing else does.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  # The image the smoke test runs against, and — after `docker tag` — the exact
  # bytes that get pushed. Never rebuilt between the two.
  LOCAL_IMAGE: gen-website:ci

jobs:
  # ---------------------------------------------------------------------------
  # Source-level checks. Fast, and the ones most likely to fail, so they run
  # first and short-circuit the expensive image job.
  # ---------------------------------------------------------------------------
  verify:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci --no-audit --no-fund

      # Guards against brand constants used as themeable values — the bug that
      # produced a light panel with light text in dark mode.
      - run: npm run check:theme

      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build

      # A static export is the deployable artefact. If `out/` is empty the build
      # "succeeded" and shipped nothing — worth one assertion.
      - name: Export is not empty
        run: |
          test -f out/index.html || { echo "out/index.html missing"; exit 1; }
          echo "exported $(find out -type f | wc -l) files"

  # ---------------------------------------------------------------------------
  # Build the image, prove it works, then publish it.
  #
  # A pull request runs everything except the push: the Dockerfile is built and
  # smoke-tested, but nothing from an unreviewed branch reaches the registry.
  # ---------------------------------------------------------------------------
  image:
    name: image
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions:
      contents: read
      packages: write

    outputs:
      image: ${{ steps.push.outputs.image }}

    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          # The SHA tag is what deploy/deploy.sh pins to, and what a rollback
          # names. `latest` is a convenience for local work only — never deploy
          # from it, because it is not a fixed artefact.
          tags: |
            type=sha,format=long,prefix=
            type=raw,value=latest,enable={{is_default_branch}}

      # `load: true` puts the image in the local docker daemon so the smoke test
      # and the vulnerability scan can both run against it BEFORE it is pushed.
      # Building straight to the registry would publish an untested artefact and
      # then test it, which is the wrong order.
      - name: Build
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          push: false
          # Always re-resolve node:22-alpine and caddy:2-alpine from the
          # registry. Both are floating tags, and with a warm layer cache the
          # builder will happily reuse a base image from weeks ago — which is
          # how an image picks up CVEs without a single line of this repo
          # changing. Costs a manifest check; buys a base image that is actually
          # current on every run.
          pull: true
          # And never cache the RUNTIME stage.
          #
          # `pull: true` above re-resolves caddy:2-alpine, but that is only half
          # the problem. When the base image digest has NOT changed, the layer
          # cache happily reuses the `apk upgrade --no-cache` layer from a
          # previous run — so the image ships whatever package versions were
          # current the day that layer was first built, no matter how many times
          # it is rebuilt afterwards.
          #
          # That is exactly how this pipeline failed on 2026-09-05: Alpine
          # published curl 8.22.0-r0 fixing CVE-2026-11352, the Dockerfile's
          # `apk upgrade` would have picked it up, and the cache served the old
          # layer with 8.20.0-r0 instead. The scan caught it, which is the system
          # working — but the fix belongs here, not in a scan exception.
          #
          # Only the runtime stage is excluded. The `build` stage keeps its
          # cache, which is where the expensive npm ci and next build live.
          no-cache-filters: runtime
          tags: ${{ env.LOCAL_IMAGE }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The same script developers run locally (`npm run docker:smoke`), against
      # the image just built. One definition of "does this container work",
      # shared by the laptop and the pipeline, so the two cannot drift.
      #
      # It asserts trailing-slash routing, a real 404 rather than a 200, the
      # security headers, cache directives, and — the one that actually caught a
      # production failure — that the container still execs under `cap_drop: ALL`.
      - name: Smoke test
        env:
          IMAGE: ${{ env.LOCAL_IMAGE }}
          SMOKE_SKIP_BUILD: "1"
        run: bash scripts/smoke.sh

      # ignore-unfixed is deliberate. A CVE with no available fix cannot be
      # actioned by this repository, and a permanently red pipeline is a pipeline
      # people learn to ignore — which costs more than the finding is worth.
      # Anything with a fix available blocks the push.
      - name: Scan image
        uses: aquasecurity/trivy-action@v0.36.0
        env:
          # Trivy pulls its vulnerability database from ghcr.io, which rate-limits
          # anonymous pulls from shared runner IPs. Authenticating with the job's
          # own token turns an intermittent TOOMANYREQUESTS failure — the kind
          # that teaches people to re-run rather than read — into a non-event.
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        with:
          image-ref: ${{ env.LOCAL_IMAGE }}
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
          # Accepted findings, each with a written justification and an EXPIRY
          # DATE — see .trivyignore.yaml. They are fixed-available CVEs in the
          # upstream Caddy binary that nothing in this repo can act on. The
          # dates are the point: on expiry they re-surface and get re-judged.
          trivyignores: .trivyignore.yaml

      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # `docker tag` + `docker push` rather than a second build-push-action run.
      # A rebuild — even a fully cached one — is a new invocation that could in
      # principle produce different bytes. Tagging guarantees the artefact that
      # passed the smoke test is the artefact in the registry.
      - name: Push
        id: push
        if: github.event_name == 'push'
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -euo pipefail
          for tag in $TAGS; do
            docker tag "$LOCAL_IMAGE" "$tag"
            docker push "$tag"
            echo "pushed $tag"
          done
          sha_tag="ghcr.io/${GITHUB_REPOSITORY,,}:${GITHUB_SHA}"
          echo "image=$sha_tag" >> "$GITHUB_OUTPUT"

      - name: Summary
        if: always()
        run: |
          {
            echo "### image"
            echo
            echo "- commit: \`${GITHUB_SHA}\`"
            if [ "${{ github.event_name }}" = "push" ]; then
              echo "- pushed: \`${{ steps.push.outputs.image }}\`"
            else
              echo "- pushed: no (pull request — built and smoke-tested only)"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
