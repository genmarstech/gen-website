# Dependency updates.
#
# The runtime image contains no Node and no application dependencies — a static
# export has none. So these updates are almost entirely about the BUILD, which
# is where the residual risk actually sits: with no user input reaching the
# page, the build pipeline is the realistic attack surface, not the site
# (docs/DEPLOYMENT.md, "Content Security Policy — a known compromise").
#
# Every PR runs the full `build` workflow — typecheck, lint, build, image,
# smoke test, image scan — so a bad bump is RED before it is merged, and
# `deploy` never sees it: nothing from an unreviewed branch reaches the server.
#
# ── RED IS NOT THE SAME AS BLOCKED, AND THAT COST A BROKEN main ─────────────
#
# This note used to say a bad bump "is caught before it can be merged". On
# 2026-10-02 #26 was red — its conflict had been resolved in the web editor,
# leaving duplicate keys in package.json and package-lock.json so `npm ci`
# could not parse either — and it was merged anyway, forty-six seconds later.
# main would not build, and every deploy after it skipped.
#
# `main` has no branch protection requiring these checks, so the pipeline
# reports and does not refuse. Until that setting exists, the sentence above
# describes what CI TELLS you, not what it prevents.

version: 2

updates:
  # ---- npm ------------------------------------------------------------------
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"
    groups:
      # Next, React and their types move together. Separate PRs for each just
      # produce a set that only passes CI once all of them are merged.
      react-next:
        patterns:
          - next
          - react
          - react-dom
          - "@types/react"
          - "@types/react-dom"
          - eslint-config-next
      # Everything else, batched by kind, so a quiet week is one PR rather than
      # six that each need a review.
      dev-tooling:
        dependency-type: development
        exclude-patterns:
          - eslint-config-next
    ignore:
      # ── eslint AND typescript MAJORS ARE PINNED BY eslint-config-next ──────
      #
      # Both were offered in #26 and both genuinely break, which nobody found
      # out at the time because that PR never got past `npm ci`:
      #
      #   typescript 7  — eslint-config-next@16 bundles typescript-eslint,
      #                   which refuses to load: "typescript-eslint does not
      #                   support TS 7.0".
      #   eslint 10     — it also bundles eslint-plugin-react, which calls the
      #                   eslint 9 rule-context API: "contextOrFilename
      #                   .getFilename is not a function", thrown while linting
      #                   eslint.config.mjs itself.
      #
      # So the ceiling on both is whatever eslint-config-next's own
      # dependencies support, and taking either bump breaks `npm run lint`
      # while typecheck and build stay green — a failure that reads as our
      # code rather than as a toolchain pin.
      #
      # Same shape as the Node pin below: revisit when eslint-config-next
      # ships support, not weekly. Minor and patch bumps still come through,
      # and those are the ones carrying the fixes.
      - dependency-name: eslint
        update-types: ["version-update:semver-major"]
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]

  # ---- GitHub Actions -------------------------------------------------------
  # The workflows hold the credentials for the deploy path, which makes a stale
  # action a more interesting target than a stale dev dependency.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: "ci"
    groups:
      actions:
        patterns: ["*"]

  # ---- Docker base images ---------------------------------------------------
  # node:22-alpine (builder) and caddy:2-alpine (runtime). The runtime one is
  # the only image that faces the internet, and it is the whole of what gets
  # patched — there is nothing else in it.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: "chore(docker)"
    ignore:
      # Node majors are a deliberate decision, not a weekly one.
      #
      # Dependabot offered node:22-alpine → node:25-alpine. Odd-numbered Node
      # releases never become LTS: 25 goes end-of-life in months, while 22 is
      # supported into 2027. Taking that bump would trade a supported builder
      # for an unsupported one, on a schedule nobody chose, to build a static
      # site whose output does not contain Node at all.
      #
      # `engines` in package.json says >=20.9.0; moving to the next LTS (24) is
      # a change to make on purpose, with the engines field updated in the same
      # commit. Patch and minor bumps of 22.x still come through — those are
      # the ones that carry the CVE fixes.
      - dependency-name: node
        update-types: ["version-update:semver-major"]
