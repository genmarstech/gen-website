# Accepted vulnerabilities. There are none, and that is the point.
#
# ── WHAT WAS HERE, AND WHY IT IS NOT ────────────────────────────────────────
#
# This file held sixteen findings, every one of them a HIGH or CRITICAL in
# /usr/bin/caddy — the Go binary inside the upstream caddy:2-alpine image.
# Each carried a written argument that the defect was unreachable in this
# deployment, and each was true. None of them was actionable from here: Caddy
# is not an apk package, so `apk upgrade` cannot touch it, and the published
# binary is compiled once per Caddy RELEASE, not once per image rebuild. The
# 2026-09-23 rebuild of caddy:2-alpine still shipped the June binary — Go
# 1.26.3, x/crypto v0.52.0, grpc v1.81.0.
#
# The file said what to do when that kept happening:
#
#     "if caddy:2-alpine still ships x/crypto below 0.55.0, stop accepting
#      these one at a time and build Caddy from caddy:2-builder-alpine on a
#      current toolchain instead. That clears every entry in this file at
#      once, and it is the right answer if upstream stays behind."
#
# On 2026-10-01 that test was run, upstream was still behind, and the answer
# was taken. The Dockerfile now compiles Caddy itself, on Go 1.26.8, with four
# transitive dependencies pinned past their fixes. Nine of the sixteen were
# Go standard library defects and the toolchain alone cleared them; the other
# seven are the four pinned modules. See the `caddybuild` stage.
#
# ── WHY THE FILE REMAINS ────────────────────────────────────────────────────
#
# An empty acceptance list is a statement: nothing is being waved through. If
# a finding appears and the honest answer is that it cannot be fixed from
# here, it goes in below WITH an expiry date and an argument — the pattern the
# old entries used, which worked, and which ended by telling its reader to
# stop using it. Keep both halves: the argument and the date. An accepted risk
# with no review date is not accepted, it is forgotten.
#
# Before adding anything here, check whether bumping a pin in the `caddybuild`
# stage fixes it instead. That is now almost always the answer.

vulnerabilities: []
